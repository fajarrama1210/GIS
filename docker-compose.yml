services:
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/backend/api}
    restart: unless-stopped
    depends_on:
      - backend
    expose:
      - "80"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      MYSQL_HOST: ${MYSQL_HOST:?Set MYSQL_HOST in Dokploy}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-jember_db}
      MYSQL_USER: ${MYSQL_USER:?Set MYSQL_USER in Dokploy}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in Dokploy}
      BPS_API_KEY: ${BPS_API_KEY:-}
